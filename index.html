<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ben Kennedy | Actor</title>
<meta name="description" content="Ben Kennedy, actor. Reel, profiles and photos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;900&display=swap" rel="stylesheet">
<style>
  /* ===== EDIT YOUR COLORS HERE ===== */
  :root{
    --bg:#0c0c0c;      /* page background */
    --text:#f1efea;    /* main text + name */
    --muted:#8d8a84;   /* small labels */
    --line:#2a2a2a;    /* thin dividers */
    --photo:#171717;   /* empty photo box color */
    --accent:#f1efea;  /* link hover color */
  }
  /* ================================= */
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  header{display:flex;justify-content:space-between;align-items:center;padding:26px 5vw}
  .logo{font-weight:500;letter-spacing:.22em;text-transform:uppercase;font-size:.85rem}
  nav{display:flex;gap:28px;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase}
  nav a{color:var(--muted);transition:color .2s}
  nav a:hover{color:var(--accent)}

  main{padding:0 5vw}
  .hero{margin:clamp(30px,7vw,100px) 0 clamp(40px,6vw,80px)}
  .hero h1{font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.88;font-size:clamp(3.6rem,16vw,15rem)}
  .hero p{margin-top:24px;color:var(--muted);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .photo{aspect-ratio:2/3;background:var(--photo);overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
  .photo:hover img{transform:scale(1.03)}

  .links{margin-top:clamp(60px,9vw,120px);border-top:1px solid var(--line)}
  .links a{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);font-size:clamp(1.4rem,3.6vw,2.6rem);font-weight:500;letter-spacing:-.01em;transition:padding .25s,color .25s}
  .links a span{font-size:.72rem;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .links a:hover{padding-left:14px;color:var(--accent)}

  footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:40px 5vw;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .photo{aspect-ratio:3/4}
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="#top">Ben Kennedy</a>
  <nav>
    <a href="#work">Work</a>
    <a href="#links">Links</a>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <h1>Ben<br>Kennedy</h1>
    <p>Actor</p>
  </section>

  <section class="grid" id="work">
    <div class="photo"><img src="images/hero1.jpg" alt="Ben Kennedy"></div>
    <div class="photo"><img src="images/hero2.jpg" alt="Ben Kennedy"></div>
    <div class="photo"><img src="images/hero3.jpg" alt="Ben Kennedy"></div>
  </section>

  <section class="links" id="links">
    <a href="https://youtu.be/Pn4vEO9lmMQ?is=Xt8WjM16WSkmCsQG" target="_blank" rel="noopener">Demo Reel <span>Watch ↗</span></a>
    <a href="https://app.castingnetworks.com/talent/public-profile/11cf0404-c1ab-11ee-895c-a73353d3d615" target="_blank" rel="noopener">Casting Networks <span>Profile ↗</span></a>
    <a href="https://resumes.actorsaccess.com/2271365-6330816" target="_blank" rel="noopener">Actors Access <span>Résumé ↗</span></a>
    <a href="https://www.instagram.com/bktheavenger26?dlrf=cjQ2MXh2dnI5aG03&utm_source=qr" target="_blank" rel="noopener">Instagram <span>@bktheavenger26 ↗</span></a>
  </section>
</main>

<footer>
  <span>© Ben Kennedy</span>
  <span>Actor</span>
</footer>

</body>
</html>
